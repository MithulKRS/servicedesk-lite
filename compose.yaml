services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE:      servicedesk
      MYSQL_USER:          servicedesk_app
      MYSQL_PASSWORD:      ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro   # auto-init on first start
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL:      jdbc:mysql://mysql:3306/servicedesk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER:     servicedesk_app
      DB_PASSWORD: ${DB_PASSWORD}
    stdin_open: true   # keeps the interactive console alive
    tty: true

volumes:
  mysql_data:
